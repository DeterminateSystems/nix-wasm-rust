name: "CI"

on:
  pull_request:
  push:
    branches:
      - main
      # Temporarily, to test publishing nix-wasm-module-make.
      - nix-make

permissions:
  id-token: "write"
  contents: "read"
  pull-requests: "write"

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: git checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@main

      - name: Set up FlakeHub Cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build and test
        run: |
          nix flake check --eval-cores 0 -L

      - name: Publish to FlakeHub
        if: matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main'
        uses: DeterminateSystems/flakehub-push@main
        with:
          visibility: "public"
          rolling: true
          include-output-paths: true

      # The nix-make dependency scanner is also published as a flake of its
      # own, DeterminateSystems/nix-wasm-module-make, so that it can be used
      # as a flake input without checking the Wasm module into the consuming
      # repository. flakehub-push publishes the git tree (via `nix flake
      # prefetch`), so the built flake directory (the module and its flake.nix)
      # is staged, not committed, to get it included.
      - name: Stage the nix-wasm-module-make flake
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nix-make')
        run: |
          nix build .#nix-wasm-plugins --out-link result
          cp -r result/nix-wasm-module-make/. nix-wasm-module-make/
          git add -f nix-wasm-module-make

      - name: Publish nix-wasm-module-make to FlakeHub
        if: matrix.os == 'ubuntu-latest' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nix-make')
        uses: DeterminateSystems/flakehub-push@main
        with:
          name: "DeterminateSystems/nix-wasm-module-make"
          directory: "nix-wasm-module-make"
          visibility: "public"
          rolling: true
